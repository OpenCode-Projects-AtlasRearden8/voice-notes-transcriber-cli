[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-notes-transcriber"
version = "0.1.0"
description = "Local-first CLI that turns phone voice memos into tidy, dated, searchable Markdown notes."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Asdale Dynamics, LLC" }]
keywords = [
    "voice-memos",
    "whisper",
    "whisper.cpp",
    "asr",
    "transcription",
    "notes",
    "markdown",
    "ollama",
    "local-first",
    "cli",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
    "License :: OSI Approved :: MIT License",
]

[project.scripts]
vnt = "vnt.cli:main"
voice-notes = "vnt.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
